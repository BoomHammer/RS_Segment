# 全图预测配置。
# 窗口大小、stride 和窗口起点由 checkpoint 对应的训练记录决定，禁止在此处覆盖。
# 本文件只保存与训练窗口无关的推理设备、融合和输出策略。

predict:
  # 模型权重。为空时由命令行提供 checkpoint。
  checkpoint: null

  # 输出文件；为空时根据 checkpoint 文件名自动生成。
  output: null
  # 是否用所有地面实测标签覆盖结果图中的对应像素；false 表示保留模型预测。
  override_ground_truth: true
  # 海拔硬约束在高斯融合后执行，优先于实测点覆盖；冲突点跳过覆盖并记录日志。
  elevation_constraint:
    enabled: true
    # 相对本 predict.yaml 所在目录解析。使用未标准化的 DEM，物理单位必须是米。
    # 读取时应用 GeoTIFF 自带的 scale/offset；无需与训练使用的 DEM 完全相同。
    dem_path: ../data/raw/static/Copernicus_DEM_100m.tif
    # 与 checkpoint 映射中任意层级的中/英文名称精确匹配，包含全部下属细类。
    # 名称未匹配时直接报错，避免约束静默失效；不改变类别编号和图例。
    classes: [高寒草原, 高寒草甸]
    # 严格大于此海拔才允许上述类别，等于阈值也禁止；其余类别正常竞争。
    min_elevation_m: 2300
    # 先对齐到输出网格，再按海拔判断；可选 nearest、bilinear、average。
    resampling: bilinear
    # 源文件有 NoData 元数据时优先使用；否则使用此原始 DN 值，null 表示无。
    dem_nodata: -9999
    # nodata：DEM 缺失像元输出 NoData（包括实测点）。
    # exclude_restricted：DEM 缺失处仅禁止受约束类别，从其余类别中选择。
    missing_dem: nodata
  # 类别映射 CSV 输出文件；为空时根据 checkpoint 文件名自动生成。
  mapping_output: null
  # 是否允许覆盖已有输出文件；false 时发现同名文件会直接报错。
  overwrite: false

  # 推理设备；cuda、cpu 或 auto。
  device: cuda

  # 自动选择显卡原生精度：4090 使用 BF16，2070 使用 FP16。
  amp:
    enabled: true
    dtype: auto

  # 批量推理参数。
  # 当前 predict.py 是单窗口串行推理，batch_size 目前仅作为目标配置记录。
  # 512 窗口和较长时间序列下，4090 建议先从 2 开始；显存充足时再增大。
  batch_size: 8

  # 数据读取和预取参数。
  dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2

  # 预测阶段 CPU 线程数。null 表示使用 PyTorch 默认值。
  # 线程过多可能与 Rasterio/GDAL 争抢 CPU，建议先从 4 或 8 测试。
  cpu_threads: 8

  # 重叠窗口融合参数。
  blending:
    method: gaussian
    sigma_scale: 0.35

  # GeoTIFF 输出参数。
  output_raster:
    compress: deflate
    predictor: 2
    bigtiff: IF_SAFER
    write_row_block: 512
