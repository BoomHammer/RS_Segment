# AnySat Base 官方核心微调：先运行 scripts/download_anysat.py。
model:
  # 模型架构标识。
  architecture: anysat
  anysat:
    # 官方 base: 768维、12头、空间编码器/融合器各6层。
    size: base
    # 单位均为目标网格像元；不是官方 Hub 接口的米。
    patch_size: 32
    subpatch_size: 4
    # 经纬度网格的名义 GSD；投影网格可设 null 自动推导真实 GSD。
    resolution_m: 250.0
    # 含 halo 的320x320窗口、10个模态共1001 tokens（含CLS）。
    max_tokens: 2048
    # 每个空间 patch 内子块数加CLS的上限，避免局部注意力超显存。
    max_subpatch_tokens: 257
    projector_chunk_size: 256
    spatial_chunk_size: 16
    gradient_checkpointing: true
    decoder_channels: 64
    # 保留 SR 子块稠密特征，与融合结果拼接后逐像元解码。
    dense_modality: SR
    # 加载完整官方共享核心；必须先下载权重。
    # 新传感器投影器独立学习，不把气候、地形等当成光学波段。
    pretrained_path: ../third_party/pretrained/anysat/models/AnySat.pth
    # 自动按产品名绑定动态特征，静态特征作为独立模态。
    # 可配置 modalities: [{name, role, features}]，每个特征恰好覆盖一次。
  regularization:
    # 解码器 dropout 概率。
    dropout: 0.2
    # 随机深度概率。
    drop_path: 0.05
  input:
    # 仅作为计算哨兵值；有效性由数据批次中的 mask 决定。
    invalid_fill_value: 0.0
  supervision:
    # 地面实测标签损失权重。
    ground_truth_weight: 1.0
    # 伪标签损失权重；仅用于训练。
    weak_label_weight: 0.5
    # Focal Loss 聚焦参数；作为层级交叉熵的辅助调制项，0 表示普通交叉熵。
    focal_gamma: 2.0
    # 无效标签的忽略值。
    ignore_index: -1
  artifacts:
    # 由阶段2 run 目录自动发现，不在此手工填写通道数或类别数。
    # 样本索引文件来源。
    sample_index: auto
    # 标签映射文件来源。
    label_mapping: auto
