# 数据检查、预处理和训练共用的数据配置。
data:
  # SAM2 权重文件；相对本配置文件所在目录解析，也可被命令行 --checkpoint 覆盖。
  sam2_checkpoint: ../SAM/sam2.1_hiera_small.pt
  # 数据总目录及各类数据子目录。
  root: ../data
  labels: ../data/labels
  raw: ../data/raw
  dynamic: ../data/raw/dynamic
  static: ../data/raw/static
  processed: ../data/processed
  # 原始样点 CSV，包含坐标和中英文分类字段。
  label_file: ../data/labels/traindata20250626ori.csv
  # 输出 GeoTIFF 中表示未标注像元的值。
  output_nodata: -9999
  # 数据检查阶段必须存在的目录，相对 data.root 目录。
  required_subdirectories:
    - labels
    - raw
    - raw/dynamic
    - raw/static
    - processed

  # 标签字段、坐标及分类编码契约。内部统一使用英文类别；中文仅写入输出映射。
  # 样点 CSV 中 X/Y 坐标使用的坐标参考系。
  label_crs: EPSG:4326
  label_schema:
    # 标签契约版本，便于后续变更字段时兼容旧数据。
    version: 1
    # 内部字段名到 CSV 列名的映射。
    columns:
      index: Index
      x: X
      y: Y
      formation: Eng_Formation
      alliance: Eng_Alliance
      chn_formation: Formation
      chn_alliance: Alliance
    # 自动编码类别时使用的起始整数编号。
    first_id: 1

  # 所有重采样/定位/模型计算使用此目标网格契约。可改为 EPSG:5070 + 250。
  target_grid:
    # 所有输入影像和输出标签统一到此 CRS。
    crs: EPSG:4326
    # 目标像元大小；EPSG:4326 下单位为度。
    resolution: [0.00225, 0.00225]
    # 可选参考影像路径；为空时由命令行 --reference-raster 提供。
    reference_raster: null

  # 所有 GeoTIFF 输入均按单波段读取；NoData 是统一的默认填充值。
  raster:
    # 当前数据读取接口是否按单波段 GeoTIFF 处理。
    single_band: true
    # 输入栅格声明的默认 NoData 值；实际文件元数据优先。
    nodata: -9999

  # 样点抽样策略；all 表示默认使用全部有效样点。
  sampling:
    strategy: all
    # 仅在显式填写整数时限制样点数量，null 表示不限制。
    max_samples: null

  # 阶段2训练数据协议；空特征清单表示使用索引中发现的全部特征。
  stage2:
    # 仅用于训练集；验证/推理不做随机增强。遥感地物通常允许旋转和翻转，
    # 可配合光谱微扰降低对少量样点和局部纹理的过拟合。
    augmentation:
      enabled: true
      horizontal_flip_probability: 0.5
      vertical_flip_probability: 0.5
      rotate_probability: 0.5
      spectral_noise_std: 0.01
      spectral_gain_std: 0.02
    features:
      dynamic: []
      static: []
      # 动态特征名称按此顺序排列；空值时按名称排序。
      dynamic_order: []
    time:
      start: "2023-01-01"
      end: "2023-12-31"
      # mask_nan：缺帧填 NaN 并由 dynamic_mask 标记；drop：丢弃缺失特征的时间点。
      missing: mask_nan
    window:
      size: [256, 256]
      stride: [128, 128]
      # 每侧上下文像素 [x, y]；256 中心窗口最多读取 320×320。
      halo: [32, 32]
    statistics_file: null
    statistics_window_size: [1024, 1024]
    split_file: ../data/processed/spatial_split.json
    cache:
      # 默认关闭窗口缓存，避免大规模数据实验占满内存。
      enabled: false
      max_items: 0
    training:
      amp_dtype: bfloat16
      gradient_accumulation_steps: 2
    sampling:
      strategy: spatial_weighted
      # 加权采样使用的划分；训练时必须为 train，验证/测试不使用该采样器。
      split: train
      num_samples: null
    # 数据集空间划分配置；将空间块分配到训练、验证和测试集。
    split:
      block_size: [1024, 1024]
      ratios: [0.6, 0.2, 0.2]
      seed: 42
    benchmark:
      enabled: true
      batches: 20
      warmup: 3
    validation:
      max_windows: 2
      require_ground_truth: true

  # 动态文件名解析规则。静态影像不从文件名推断时间。
  dynamic_filename:
    # 动态影像文件扩展名。
    extension: .tif
    # 日尺度文件名正则表达式，支持可选波段号。
    date_pattern: "^(?P<category>[A-Za-z]+)(?P<date>\\d{6})(?:B(?P<band>\\d+))?\\.tif$"
    # 月尺度文件名正则表达式。
    month_pattern: "^(?P<category>[A-Za-z]+)(?P<month>\\d{4})\\.tif$"
    # 日尺度日期解析格式。
    date_format: "%y%m%d"
    # 月尺度日期解析格式。
    month_format: "%y%m"

  # 动态解析结果的 JSON/YAML 记录结构。
  metadata_schema:
    version: 1
    record:
      # 下面是 metadata JSON 中每条记录的字段类型约定。
      path: string
      filename: string
      category: string
      temporal_resolution: date | month
      date: YYYY-MM-DD | null
      month: YYYY-MM | null
      band: integer | null
