# 主训练配置。数据路径和数据集结构由 data.yaml 管理，模型结构由 model.yaml 管理。
training:
  # 训练轮数。
  epochs: 30
  # auto：4090 等支持原生 BF16 的显卡使用 BF16；2070 等使用 FP16 + 梯度缩放。
  # 也可指定 bfloat16、float16 或 none；不支持原生 BF16 时自动回退到 FP16。
  amp_dtype: auto
  # 梯度累积步数；用于在较小显存下模拟更大 batch。
  gradient_accumulation_steps: 2
  # 随机种子，保证数据采样和增强可复现。
  seed: 42
  early_stopping:
    # 是否在验证损失长期不下降时提前结束训练。
    enabled: true
    # 早停监控指标名称。
    monitor: val_loss
    # 连续多少轮没有改善后停止。
    patience: 5
    # 认为有效改善所需的最小损失下降量。
    min_delta: 0.0001

dataloader:
  # 训练/验证每个 batch 包含的窗口数量。增大可提高 GPU 吞吐，但会增加显存占用。
  batch_size: 2
  # 验证没有反向传播；即使训练因 halo 降为单窗口，验证仍可按此批量前向。
  # 8GB 显卡上验证也会产生整套前向激活，必须使用单窗口批次。
  validation_batch_size: 1
  # 验证单独使用较小的 worker 池；验证结束即释放，不常驻、不使用页锁定预取。
  validation_num_workers: 2
  # 数据加载子进程数量。大于 0 时可并行读取和预处理 GeoTIFF，减少 GPU 等待。
  # 建议从 2~4 开始测试；过大可能造成磁盘争用和内存占用增加。
  num_workers: 6
  # 将 batch 复制到页锁定内存，配合 non_blocking=True 加快 CPU 到 GPU 的传输。
  pin_memory: true
  # 保留 worker 进程，避免每个 epoch 重复创建进程；仅在 num_workers > 0 时有效。
  persistent_workers: true
  # 每个 worker 提前准备的 batch 数量；增大可隐藏读取延迟，但会增加内存占用。
  prefetch_factor: 2
  # 最后一个不完整 batch 是否丢弃。训练时可保持 batch 尺寸稳定，验证时通常关闭。
  drop_last: false

# 默认仅采样核心区域包含实测点的训练窗口。窗口内的无标签像素和 halo
# 仍作为上下文输入，但完全没有实测监督的窗口不进入训练和验证。
supervision_policy:
  # 真实点按空间块获得唯一 train/validation/test 归属，跨界窗口不得改变点的归属。
  fixed_spatial_supervision: true
  # 是否丢弃输入范围（含 halo）触及其他划分空间块的窗口。
  # 当前关闭：稀疏样点靠近块边界时，严格丢弃会让部分训练类没有可用窗口。
  # 关闭不影响监督隔离；非训练块的真实标签和伪标签仍始终为 ignore_index。
  isolate_spatial_splits: false
  measured_windows_only: true
  skip_unlabeled_validation: true
  # 每轮让训练划分中的全部独立真实点各作为锚点一次，并按类别交错排序；
  # 每个锚点随机选择一个覆盖窗口，训练伪标签也只保留训练块内像元。
  class_balanced_point_sampling: true

optimizer:
  # 优化器名称；当前训练入口使用 AdamW。
  name: adamw
  # 初始学习率。
  learning_rate: 0.0001
  # AdamW 权重衰减系数。
  weight_decay: 0.01
  # AdamW 的 beta 参数。
  betas: [0.9, 0.999]

scheduler:
  # 学习率调度器名称；当前训练入口使用 cosine。
  name: cosine
  # 预热阶段占总优化步数的比例。
  warmup_ratio: 0.05

gradient_clipping:
  # 是否启用梯度范数裁剪。
  enabled: true
  # 梯度范数上限。
  max_norm: 1.0

ema:
  # 是否维护指数滑动平均模型权重。
  enabled: true
  # EMA 衰减率，越接近 1 越平滑。
  decay: 0.99

checkpoint:
  # checkpoint 文件名模板；{timestamp} 由训练入口替换。
  filename: model_{timestamp}.pt
