# 阶段3模型架构配置。
model:
  # 模型架构标识。
  architecture: maestro_s
  maestro:
    # Small 尺寸来自 IGNF/MAESTRO 官方实现；默认随机初始化。
    embed_dim: 384
    depth: 12
    heads: 6
    mlp_ratio: 2
    inter_depth: 3
    # 320×320（含 halo）→ 10×10 网格；9 个动态产品各 4 帧
    # 加 1 份静态输入，共 3700 tokens。超过预算立即报错。
    patch_size: 32
    temporal_bins: 4
    max_tokens: 4096
    gradient_checkpointing: true
    # 默认按产品分别 token 化；光学/植被、环境、静态变量三组。
    # 可配置 modalities: [{name, role, group, features, temporal_bins}]。
    # features 必须按名称恰好覆盖输入；不把不同时刻堆成通道。
  regularization:
    # 解码器 dropout 概率。
    dropout: 0.2
    # 随机深度概率。
    drop_path: 0.05
  input:
    # 仅作为计算哨兵值；有效性由数据批次中的 mask 决定。
    invalid_fill_value: 0.0
  supervision:
    # 地面实测标签损失权重。
    ground_truth_weight: 1.0
    # 伪标签损失权重；仅用于训练。
    weak_label_weight: 0.5
    # Focal Loss 聚焦参数；作为层级交叉熵的辅助调制项，0 表示普通交叉熵。
    focal_gamma: 2.0
    # 无效标签的忽略值。
    ignore_index: -1
  artifacts:
    # 由阶段2 run 目录自动发现，不在此手工填写通道数或类别数。
    # 样本索引文件来源。
    sample_index: auto
    # 标签映射文件来源。
    label_mapping: auto
