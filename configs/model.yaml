# 阶段3模型架构配置。
model:
  # 模型架构标识。
  architecture: segformer_utae_pretrained
  # 使用 Hugging Face 官方 MiT-B1 SegFormer 编码器和完整 U-TAE/L-TAE 动态编码器。
  backbone: mit_b1
  pretrained:
    # 相对本配置文件解析；权重由 scripts/download_mit.py 下载。
    path: ../third_party/pretrained/mit-b1
    revision: 13ddceec4e8bdf401e7cd7acf5aebc526222518c
    freeze_stages: 2
  temporal:
    # 动态时序编码器类型。
    type: utae_ltae
    # 完整 U-TAE 每次编码的帧数；8GB 显卡保持 2，避免更大分块挤占显存。
    frame_chunk_size: 2
    # 时序特征投影通道数。
    projection_channels: 64
  static:
    # 静态特征投影通道数。
    projection_channels: 32
  fusion:
    # 动静态特征融合后的通道数。
    output_channels: 96
  regularization:
    # 解码器 dropout 概率。
    dropout: 0.
    # 随机深度概率。
    drop_path: 0.05
  input:
    # 仅作为计算哨兵值；有效性由数据批次中的 mask 决定。
    invalid_fill_value: 0.0
  supervision:
    # 地面实测标签损失权重。
    ground_truth_weight: 1.0
    # 伪标签损失权重；仅用于训练。
    weak_label_weight: 0.5
    # Focal Loss 聚焦参数；作为层级交叉熵的辅助调制项，0 表示普通交叉熵。
    focal_gamma: 2.0
    # 无效标签的忽略值。
    ignore_index: -1
  artifacts:
    # 由阶段2 run 目录自动发现，不在此手工填写通道数或类别数。
    # 样本索引文件来源。
    sample_index: auto
    # 标签映射文件来源。
    label_mapping: auto
