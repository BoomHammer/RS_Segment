# Reproduction control: the main-branch architecture on the current branch.
model:
  architecture: segformer_utae
  backbone: mit_b1
  temporal:
    type: utae_ltae
    projection_channels: 64
  static:
    projection_channels: 32
  fusion:
    output_channels: 96
  regularization:
    dropout: 0.1
    drop_path: 0.05
  input:
    invalid_fill_value: 0.0
  supervision:
    ground_truth_weight: 1.0
    weak_label_weight: 0.5
    focal_gamma: 2.0
    ignore_index: -1
  artifacts:
    sample_index: auto
    label_mapping: auto
