[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rs-segment"
version = "0.1.0"
description = "Weakly supervised continental-scale remote-sensing vegetation segmentation"
readme = "DEVELOPMENT.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.1",
    "pyyaml>=6.0.2",
    "rasterio>=1.4",
    "pyproj>=3.7",
    "tqdm>=4.67",
    "torch>=2.5",
    "torchgeo>=0.7",
    "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
rs-check-data = "data_check:main"
rs-compute-stats = "data_stats:main"
rs-prepare-data = "prepare_data:main"
rs-pipeline = "pipeline:main"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "scripts", "scripts/test"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["scripts/test"]
addopts = "-ra -p no:cacheprovider --basetemp=.pytest_tmp"
pythonpath = ["src"]

# 添加 PyTorch 的 CUDA 12.4 专属源
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# 强制这两个包从 pytorch 源下载，而不是默认的 PyPI
[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
